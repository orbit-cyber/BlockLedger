name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the plugin jar
        run: mvn -B -DskipTests package

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: BlockLedger
          path: target/BlockLedger-*.jar
          if-no-files-found: error

      # Publishes the jar to the GitHub release, so the download link stays put.
      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: BlockLedger 1.0.0
          body: |
            Block logging with inspect, rollback and restore for Paper 26.3.

            - Requires Java 25 and Paper 26.3
            - Drop `BlockLedger-1.0.0.jar` into `plugins/`
            - The SQLite driver is downloaded by Paper on first start, so the server needs internet once

            See the README for commands, filters and permissions.
          files: target/BlockLedger-*.jar
          fail_on_unmatched_files: true
